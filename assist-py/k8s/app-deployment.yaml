apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assist-py
  template:
    metadata:
      labels:
        app: assist-py
    spec:
      containers:
        - name: app
          image: assist-py:latest
          imagePullPolicy: Never  # <-- ДОБАВИТЬ ЭТУ СТРОКУ
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-configmap
            - secretRef:
                name: app-secret
          # ... остальная часть файла без изменений